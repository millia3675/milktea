# Only declare the hosted settings that Milktea needs.
project_id = "milktea"

[auth]
site_url = "https://millia3675.github.io/milktea/"
additional_redirect_urls = ["https://millia3675.github.io/milktea/auth-callback.html"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
# Keep email/password login enabled; auth.enable_signup above blocks public signup.
enable_signup = true
enable_confirmations = true

[functions.delete-account]
# The handler validates the user's bearer token with Auth getUser and rechecks the password.
# Do not rely on the gateway's legacy JWT/API-key check for authorization.
verify_jwt = false
